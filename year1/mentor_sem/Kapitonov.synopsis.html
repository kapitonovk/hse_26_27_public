# Пространственная дифференциация гидрологических свойств городской территории

## Оценка в контексте поверхностного стока

Синопсис курсовой работы

<br>

Капитонов Кирилл, МПДПГ-261

Научный руководитель: Матасов Виктор Михайлович,

# От инфраструктуры — к пониманию территории

.left-column[
Городская территория рассматривается через её участие
в формировании, удержании и перераспределении
дождевого и снеготалого поверхностного стока.

Для планирования важно понимать:

- как различаются гидрологические свойства территорий;
- как эти различия связаны с городской морфологией;
- как они проявляются на разных масштабах.

**Проблема**: насколько разные методы учитывают
пространственную структуру города и дают сопоставимые
представления о гидрологических различиях территорий?


]

.right-column[
<img src="img/lee_et_al_1.png" style="width:80%;">

.source[По Lee et al., 2018, рис. 5]
]

<br>
.future[
**Пространственные различия** → Типы территорий → Подходы к управлению
]

# Цель и задачи

**Цель**

Выявить пространственные различия гидрологических свойств
городских территорий и их связь с морфологией городской среды
на основе сопоставления подходов к оценке
таких свойств в контексте поверхностного стока

**Основные задачи**

1. Рассмотреть теоретические подходы и систематизировать
методы оценки
2. Сопоставить способы учета городской морфологии, пространственных связей и масштаба
3. Провести ГИС-оценку выбранной территории с использованием отобранных подходов
4. Интерпретировать пространственные различия и определить возможности и ограничения методов для характеристики дифференциации свойств территории

---
class: dense

# Исследовательский вопрос и гипотезы

Как гидрологические различия территорий связаны с морфологией городской среды и насколько сохраняются при изменении метода и масштаба оценки?

**Гипотезы**

1. При близком составе покрытий территории различаются по гидрологическим свойствам вследствие различий в конфигурации и связности компонентов

2. Учет конфигурации и связности меняет оценки по сравнению с подходами, основанными преимущественно на площадных соотношениях покрытий

3. Объясняющее значение морфологических характеристик меняется с масштабом анализа

<img src="img/yin_et_al_1.png" style="width:90%;">

.source[По Yin et al., 2025, рис. 2]

# Исследовательский подход

<!-- ### Теоретическая рамка

Городская гидрология · Городская морфология · Экосистемные услуги
-->

**Логика исследования**

Обзор литературы → Сопоставление подходов →
ГИС-апробация → Интерпретация пространственных различий

**Предполагаемые данные**

- Слои проницаемости покрытий, застройки, озеленения, водоемов
- Рельеф и пространственные связи
- Сведения об осадках, снеготаянии и водоотведении

.future[
Конкретный кейс и набор методов будут определены по итогам обзора и оценки обеспеченности данными.
]

# Ожидаемые результаты

**Систематизация подходов**

Сопоставление по учитываемым процессам, показателям, масштабам, единицам анализа и данным

**Пространственные оценки**

Сравнительные характеристики гидрологических свойств выбранной городской территории

**Интерпретация**

Выводы о связи оценок с морфологией городской среды и об их зависимости от метода и масштаба анализа

.future[
Перспектива продолжения:
типы территорий и дифференцированные подходы к управлению стоком.
]
